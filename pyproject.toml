[project]
name = "dolgoprudny-transport-model"
version = "0.1.0"
description = "Учебная макромодель автомобильного транспорта Долгопрудного"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "geopandas>=1.0.1",
    "matplotlib>=3.9.0",
    "networkx>=3.4.0",
    "numpy>=2.1.0",
    "osmnx>=2.0.0",
    "pandas>=2.2.0",
    "requests>=2.32.0",
    "shapely>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
]

[tool.uv]
package = false
